name: CI

on:
  # Populate caches on main so subsequent pull requests can restore them.
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Verify Linux
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LINUX_BUILD_PACKAGES: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve Linux build dependencies
        id: linux-packages
        timeout-minutes: 5
        env:
          LC_ALL: C
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          mkdir -p "$RUNNER_TEMP/apt-archives"
          read -r -a packages <<< "$LINUX_BUILD_PACKAGES"
          sudo apt-get --print-uris --no-install-recommends --yes \
            -o "Dir::Cache::archives=$RUNNER_TEMP/apt-archives" \
            install "${packages[@]}" > "$RUNNER_TEMP/apt-package-plan"
          package_hash=$(sha256sum "$RUNNER_TEMP/apt-package-plan" | cut -d ' ' -f1)
          echo "hash=$package_hash" >> "$GITHUB_OUTPUT"

      - name: Cache Linux package downloads
        uses: actions/cache@v6
        with:
          # Keep APT's locks and partial downloads out of the cache.
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-v1-ubuntu-24.04-${{ runner.arch }}-${{ steps.linux-packages.outputs.hash }}

      - name: Install Linux build dependencies
        timeout-minutes: 5
        run: |
          read -r -a packages <<< "$LINUX_BUILD_PACKAGES"
          sudo apt-get --no-install-recommends --yes \
            -o "Dir::Cache::archives=$RUNNER_TEMP/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install "${packages[@]}"

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/wails-cli
          key: wails-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod') }}

      - name: Install matching Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/wails-cli
        run: |
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails_version"

      - name: Add Wails CLI to PATH
        run: echo "$RUNNER_TEMP/wails-cli" >> "$GITHUB_PATH"

      - name: Verify frontend and native Linux build
        run: wails3 task verify

      - name: Check for generated changes
        run: git diff --exit-code

  windows:
    name: Verify Windows
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Go cache paths
        run: |
          "GOMODCACHE=$(Join-Path $env:RUNNER_TEMP 'go-mod')" >> $env:GITHUB_ENV
          "GOCACHE=$(Join-Path $env:RUNNER_TEMP 'go-build')" >> $env:GITHUB_ENV

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/wails-cli
          key: wails-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod') }}

      - name: Install matching Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/wails-cli
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add Wails CLI to PATH
        run: (Join-Path $env:RUNNER_TEMP 'wails-cli') >> $env:GITHUB_PATH

      - name: Verify frontend and native Windows build
        run: wails3 task verify

      - name: Check for generated changes
        run: git diff --exit-code

  macos:
    name: Verify macOS
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/wails-cli
          key: wails-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod') }}

      - name: Install matching Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/wails-cli
        run: |
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails_version"

      - name: Add Wails CLI to PATH
        run: echo "$RUNNER_TEMP/wails-cli" >> "$GITHUB_PATH"

      - name: Verify frontend and native macOS build
        run: wails3 task verify ARCH=arm64

      - name: Check for generated changes
        run: git diff --exit-code
